<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skylane Games - Play Free Online Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Block -->
    <header class="header">
        <div class="nav-container">
            <h1 class="logo">Skylane<span>Games</span></h1>
            <input type="text" id="searchInput" onkeyup="searchGames()" placeholder="Search 100+ games...">
        </div>
    </header>

    <!-- Category Strip (AtmeGame Style) -->
    <nav class="category-strip">
        <button class="cat-btn active" onclick="filterCategory('all')">🎮 All</button>
        <button class="cat-btn" onclick="filterCategory('action')">⚔️ Action</button>
        <button class="cat-btn" onclick="filterCategory('racing')">🏎️ Racing</button>
        <button class="cat-btn" onclick="filterCategory('arcade')">🕹️ Arcade</button>
        <button class="cat-btn" onclick="filterCategory('puzzle')">🧩 Puzzle</button>
        <button class="cat-btn" onclick="filterCategory('sports')">⚽ Sports</button>
    </nav>

    <!-- Top Sponsored Ad Slot -->
    <div class="ad-banner">
        <span class="ad-label">SPONSORED</span>
        <div class="ad-slot"><!-- AdSense Code Yahan Aayega --></div>
    </div>

    <!-- Game Player Section (Pop-up Player) -->
    <div id="gamePlayerSection" class="player-container" style="display:none;">
        <div class="player-header">
            <h3 id="activeGameTitle">Game Name</h3>
            <button onclick="closeGame()" class="close-btn">❌ Close Game</button>
        </div>
        <iframe id="gameIframe" src="" frameborder="0" allowfullscreen></iframe>
    </div>

    <!-- Main Content Area -->
    <main class="main-container">
        <h2 class="section-title">🔥 Trending Games</h2>
        <div class="games-grid" id="gamesGrid">
            <!-- JavaScript se automatic 100+ games yahan aayenge -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
