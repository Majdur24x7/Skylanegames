<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skylane Games - Play Free Online HTML5 Games</title>
    <!-- Tailwind CSS for Modern Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Style Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-yellow-400 tracking-wider">Skylane<span class="text-white">Games</span></a>
            <div class="text-xs bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 px-3 py-1.5 rounded-full font-semibold">
                ⚡ No Login Required
            </div>
        </div>
    </header>

    <!-- AdSense Top Banner Space -->
    <div class="max-w-7xl mx-auto px-4 my-4 w-full">
        <div class="bg-gray-800 border border-dashed border-gray-600 rounded-lg h-20 flex items-center justify-center text-gray-400 text-xs">
            [ AdSense Header Banner Space ]
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 flex-grow w-full py-4">
        <!-- Hero Section -->
        <section class="bg-gradient-to-r from-purple-900 via-indigo-900 to-gray-900 rounded-2xl p-6 md:p-10 mb-8 text-center shadow-xl border border-gray-800">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-3">Play Free HTML5 Games Instantly</h1>
            <p class="text-gray-300 text-sm md:text-base">No downloads or logins. Enjoy action, puzzle, and arcade games directly in your browser.</p>
        </section>

        <!-- Games Grid Section (Yeh JavaScript se automatic bharega) -->
        <section class="mb-12">
            <h2 class="text-xl font-bold mb-6 border-l-4 border-yellow-400 pl-3">All Games Collection</h2>
            <div id="gamesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 md:gap-6">
                <!-- Games will load dynamically here -->
            </div>
        </section>
    </main>

    <!-- Full Screen Game Modal Player -->
    <div id="gameModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col">
        <div class="bg-gray-800 px-4 py-3 flex justify-between items-center border-b border-gray-700">
            <h2 id="modalGameTitle" class="font-bold text-base text-yellow-400">Loading...</h2>
            <button onclick="closeGame()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-1.5 rounded-lg text-sm cursor-pointer transition">
                ✕ Close / Back
            </button>
        </div>
        <div class="flex-grow flex items-center justify-center p-2 relative">
            <div id="gameContainer" class="w-full h-full max-w-5xl max-h-[85vh] bg-gray-950 rounded-xl overflow-hidden border border-gray-800 flex items-center justify-center text-center">
                <!-- Game Iframe loads here -->
            </div>
        </div>
    </div>

    <!-- Simple Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 py-6 text-center text-xs text-gray-400">
        <p>&copy; 2026 Skylane Games. All rights reserved.</p>
    </footer>

    <!-- Custom JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
