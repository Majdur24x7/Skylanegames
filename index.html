<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skylane Games - Play Free Online Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> Skylane <span>Games</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search games..." onkeyup="searchGames()">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
    </header>

    <!-- Top Banner Ad Space -->
    <div class="ad-container top-ad-slot">
        <div class="ad-placeholder">Top Leaderboard Ad Space (728x90)</div>
    </div>

    <!-- Category Bar -->
    <nav class="categories">
        <button class="cat-btn active" onclick="filterCategory('all')">All</button>
        <button class="cat-btn" onclick="filterCategory('action')">Action</button>
        <button class="cat-btn" onclick="filterCategory('racing')">Racing</button>
        <button class="cat-btn" onclick="filterCategory('arcade')">Arcade</button>
        <button class="cat-btn" onclick="filterCategory('puzzle')">Puzzle</button>
    </nav>

    <!-- Dedicated Game Player Area (With Side Ads) -->
    <section id="gamePlayerSection" class="game-player-section" style="display: none;">
        <div class="game-player-header">
            <h2 id="activeGameTitle">Playing Game</h2>
            <button class="close-btn" onclick="closeGame()"><i class="fa-solid fa-xmark"></i> Close Game</button>
        </div>
        
        <div class="game-layout">
            <!-- Left Side Ad (Desktop) -->
            <div class="ad-container sidebar-ad">
                <div class="ad-placeholder">Left Ad (160x600)</div>
            </div>

            <!-- Main Game Frame -->
            <div class="iframe-wrapper">
                <iframe id="gameIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>

            <!-- Right Side Ad (Desktop) -->
            <div class="ad-container sidebar-ad">
                <div class="ad-placeholder">Right Ad (160x600)</div>
            </div>
        </div>

        <!-- Bottom Banner Ad Slot -->
        <div class="ad-container bottom-ad-slot">
            <div class="ad-placeholder">Bottom Ad Space (728x90)</div>
        </div>
    </section>

    <!-- Games Grid -->
    <main class="container">
        <h2 class="section-title">Popular Games</h2>
        <div class="games-grid" id="gamesGrid">
            
            <!-- Game Card 1 -->
            <div class="game-card" data-category="racing" onclick="playGame('Moto X3M', 'https://html5.gamedistribution.com/6c66657c96a7493282f6e520c159f8a3/')">
                <img src="https://img.gamedistribution.com/6c66657c96a7493282f6e520c159f8a3-512x512.jpeg" alt="Moto X3M">
                <div class="game-info">
                    <h3>Moto X3M</h3>
                    <span class="badge">Racing</span>
                </div>
            </div>

            <!-- Game Card 2 -->
            <div class="game-card" data-category="action" onclick="playGame('Subway Surfers', 'https://html5.gamedistribution.com/2b347214e9f34f7fb39110757a2c85b1/')">
                <img src="https://img.gamedistribution.com/2b347214e9f34f7fb39110757a2c85b1-512x512.jpeg" alt="Subway Surfers">
                <div class="game-info">
                    <h3>Subway Surfers</h3>
                    <span class="badge">Action</span>
                </div>
            </div>

            <!-- Game Card 3 -->
            <div class="game-card" data-category="arcade" onclick="playGame('Pac-Xon', 'https://html5.gamedistribution.com/492211d13f384a27a810b47e4526dfc9/')">
                <img src="https://img.gamedistribution.com/492211d13f384a27a810b47e4526dfc9-512x512.jpeg" alt="Pac-Xon">
                <div class="game-info">
                    <h3>Pac-Xon</h3>
                    <span class="badge">Arcade</span>
                </div>
            </div>

            <!-- Game Card 4 -->
            <div class="game-card" data-category="puzzle" onclick="playGame('2048', 'https://html5.gamedistribution.com/8bf0f666fef84c72a8c3d100d04bfbfb/')">
                <img src="https://img.gamedistribution.com/8bf0f666fef84c72a8c3d100d04bfbfb-512x512.jpeg" alt="2048">
                <div class="game-info">
                    <h3>2048</h3>
                    <span class="badge">Puzzle</span>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Skylane Games. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
